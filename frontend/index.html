<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearBid NJ - Pre-Auction Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <h2>ClearBid <span>NJ</span></h2>
    </div>
    <span class="badge-demo">Demo Interactivo Inversionista</span>
  </header>

  <main class="container">
    <!-- Filtros Interactivos -->
    <section class="filters-bar">
      <input type="text" id="searchInput" placeholder="Buscar por dirección o ciudad...">
      
      <select id="countyFilter">
        <option value="" selected>Todos los Condados (Counties)</option>
        <option value="Mercer">Mercer</option>
        <option value="Essex">Essex</option>
        <option value="Hudson">Hudson</option>
        <option value="Atlantic">Atlantic</option>
      </select>

      <select id="riskFilter">
        <option value="" selected>Todos los Riesgos (Semáforo)</option>
        <option value="GREEN">Verde (Bajo Riesgo)</option>
        <option value="YELLOW">Amarillo (Riesgo Medio)</option>
        <option value="RED">Rojo (Alto Riesgo)</option>
      </select>
    </section>

    <!-- Grid de Tarjetas -->
    <section class="grid-container" id="propertiesGrid">
      <!-- Se llena dinámicamente con JS desde Supabase -->
    </section>
  </main>

  <!-- Modal Detalle en 4 Pestañas -->
  <div class="modal-overlay" id="propertyModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modalAddress">Address</h3>
          <p id="modalSubhead">County & Case</p>
        </div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-financial')">💰 Financiera</button>
        <button class="tab-btn" onclick="switchTab('tab-legal')">⚖️ Legal</button>
        <button class="tab-btn" onclick="switchTab('tab-physical')">🏠 Física</button>
        <button class="tab-btn" onclick="switchTab('tab-risk')">🚦 Semáforo</button>
      </div>

      <div class="modal-body">
        <!-- Pestaña Financiera -->
        <div id="tab-financial" class="tab-content active">
          <div class="metrics-grid">
            <div class="metric-box"><label>Precio Apertura</label><span id="mOpeningBid">$0</span></div>
            <div class="metric-box"><label>Valor ARV</label><span id="mArv">$0</span></div>
            <div class="metric-box"><label>Reparaciones Est.</label><span id="mRepairs">$0</span></div>
            <div class="metric-box alert"><label>Liens (Gravámenes)</label><span id="mLiens">$0</span></div>
            <div class="metric-box highlight"><label>Puja Máxima Sugerida (Regla 70%)</label><span id="mMaxBid">$0</span></div>
          </div>
        </div>

        <!-- Pestaña Legal -->
        <div id="tab-legal" class="tab-content">
          <ul class="data-list">
            <li><strong>Fecha de Subasta:</strong> <span id="lDate"></span></li>
            <li><strong>Número de Caso:</strong> <span id="lCase"></span></li>
            <li><strong>Estado del Título:</strong> <span id="lTitle"></span></li>
            <li><strong>Ocupación:</strong> <span id="lOccupancy"></span></li>
          </ul>
        </div>

        <!-- Pestaña Física -->
        <div id="tab-physical" class="tab-content">
          <ul class="data-list">
            <li><strong>Superficie:</strong> <span id="pSqft"></span> sqft</li>
            <li><strong>Dormitorios:</strong> <span id="pBeds"></span></li>
            <li><strong>Año de Construcción:</strong> <span id="pYear"></span></li>
          </ul>
        </div>

        <!-- Pestaña Semáforo -->
        <div id="tab-risk" class="tab-content">
          <div class="risk-banner" id="rBanner">Riesgo Evaluado: GREEN</div>
          <div class="reasons-box">
            <h4>Alertas del Motor de Reglas:</h4>
            <ul id="rReasonsList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cargar SDK Oficial de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cargar lógica principal -->
  <script src="app.js"></script>
</body>
</html>
